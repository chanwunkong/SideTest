<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StructHealth</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="config.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .view-section {
      display: none;
      height: 100%;
      overflow-y: auto;
      padding-bottom: 100px;
    }

    .view-section.active {
      display: block;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .tree-indent {
      border-left: 2px solid #f1f5f9;
      padding-left: 0.75rem;
      margin-left: 0.75rem;
    }
  </style>
</head>

<body class="bg-gray-50 text-gray-900 h-[100dvh] w-full overflow-hidden flex flex-col dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300">

  <main class="flex-1 relative overflow-hidden w-full max-w-md mx-auto bg-white shadow-2xl flex flex-col h-full dark:bg-gray-800 transition-colors duration-300">

    <header class="flex items-center justify-between p-6 bg-white shrink-0 sticky top-0 z-20 dark:bg-gray-800 transition-colors duration-300">
      <div class="flex items-center gap-2">
        <div class="rounded-xl bg-gray-900 p-2 text-white dark:bg-gray-700" id="header-icon"></div>
        <h1 class="text-xl font-black tracking-tight dark:text-white">StructHealth</h1>
      </div>
      <div class="flex items-center gap-3">
        <a href="Hangboard.html" title="前往 Hangboard 指力訓練"
          class="flex h-8 w-8 items-center justify-center rounded-full bg-gray-100 text-gray-400 active:scale-95 transition-transform dark:bg-gray-700 dark:text-gray-300">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </a>
        <div id="user-avatar" onclick="app.toggleAuth()"
          class="flex h-8 w-8 items-center justify-center rounded-full bg-gray-100 text-xs font-bold text-gray-400 cursor-pointer active:scale-95 transition-transform dark:bg-gray-700 dark:text-gray-300">
          --
        </div>
      </div>
    </header>

    <div class="flex-1 overflow-y-auto pb-24 px-6 space-y-8 no-scrollbar relative">

      <div id="view-dashboard" class="view-section active space-y-8 py-4">
        <section class="space-y-4">
          <div class="flex items-end justify-between px-1">
            <h2 class="text-[10px] font-black uppercase tracking-widest text-gray-400">進行中目標</h2>
            <button onclick="app.addGoal()"
              class="text-[10px] font-bold text-gray-900 bg-gray-100 px-2 py-1 rounded active:scale-95 dark:text-white dark:bg-gray-700">＋ 新增</button>
          </div>
          <div id="goals-container" class="grid gap-3"></div>
        </section>

        <section class="space-y-4">
          <div class="flex items-end justify-between px-1">
            <h2 class="text-[10px] font-black uppercase tracking-widest text-gray-400">支柱狀態總覽</h2>
            <button onclick="app.addPillar()"
              class="text-[10px] font-bold text-gray-900 bg-gray-100 px-2 py-1 rounded active:scale-95 dark:text-white dark:bg-gray-700">＋ 新增</button>
          </div>
          <div id="pillars-container" class="space-y-3"></div>
        </section>

        <section class="space-y-4">
          <h2 class="text-[10px] font-black uppercase tracking-widest text-gray-400 px-1">完成度日曆</h2>
          <div class="rounded-3xl border border-gray-100 bg-white p-6 shadow-sm dark:bg-gray-800 dark:border-gray-700">
            <div
              class="mb-6 grid grid-cols-7 gap-2 text-center text-[10px] font-black uppercase tracking-tighter text-gray-300">
              <div>M</div>
              <div>T</div>
              <div>W</div>
              <div>T</div>
              <div>F</div>
              <div>S</div>
              <div>S</div>
            </div>
            <div id="calendar-container" class="grid grid-cols-7 gap-y-4 gap-x-2"></div>
          </div>
        </section>
      </div>

      <div id="view-pillar-detail" class="view-section space-y-6 py-4">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <button onclick="app.switchView('dashboard')"
              class="p-2 bg-gray-50 rounded-full text-gray-400 active:scale-95 dark:bg-gray-700 dark:text-gray-300">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="m15 18-6-6 6-6" />
              </svg>
            </button>
            <h2 id="pillar-detail-title" class="text-xl font-black dark:text-white">載入中...</h2>
          </div>
          <div class="flex gap-2">
            <button onclick="app.addNode('root', 'folder')"
              class="p-2 bg-gray-100 text-gray-700 rounded-lg active:scale-95 dark:bg-gray-700 dark:text-gray-200">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M12 10v6M9 13h6M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" />
              </svg>
            </button>
            <button onclick="app.addNode('root', 'leaf')"
              class="p-2 bg-blue-600 text-white rounded-lg shadow-md active:scale-95">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
                <polyline points="14 2 14 8 20 8" />
                <line x1="12" y1="18" x2="12" y2="12" />
                <line x1="9" y1="15" x2="15" y2="15" />
              </svg>
            </button>
          </div>
        </div>
        <div class="rounded-3xl border border-gray-100 bg-white p-4 shadow-sm min-h-[60vh] dark:bg-gray-800 dark:border-gray-700">
          <div id="tree-container" class="space-y-2"></div>
        </div>
      </div>

      <div id="view-execution" class="view-section space-y-8 py-4">
        <header class="flex justify-between items-end">
          <div>
            <h1 class="text-2xl font-black dark:text-white">執行切片</h1>
            <p class="text-[10px] text-gray-400 mt-1 uppercase tracking-widest font-black">今日行動與任務流</p>
          </div>
          <button onclick="app.addTask()"
            class="text-[10px] font-bold text-gray-900 px-3 py-1.5 bg-gray-100 rounded-lg active:scale-95 dark:text-white dark:bg-gray-700">＋
            新增任務</button>
        </header>

        <section class="rounded-3xl bg-gray-900 p-6 text-white shadow-xl relative overflow-hidden dark:bg-black">
          <div class="relative z-10">
            <h4 class="mb-2 text-[10px] font-black uppercase tracking-widest text-gray-300">AI 動態校準</h4>
            <p class="text-sm font-medium leading-relaxed">
              AI 分析保留區：將依據支柱數值自動重算並調配今日任務。
            </p>
          </div>
          <div class="absolute right-[-20px] top-[-20px] opacity-10">
            <svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path
                d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </div>
        </section>

        <div id="tasks-container" class="space-y-6"></div>
      </div>

    </div>

    <nav
      class="fixed bottom-0 left-0 right-0 mx-auto flex h-16 max-w-md items-center justify-around border-t border-gray-100 bg-white/90 backdrop-blur-md z-30 px-4 dark:bg-gray-800/90 dark:border-gray-700">
      <button onclick="app.switchView('dashboard')"
        class="nav-btn active flex flex-col items-center gap-1 transition-colors text-gray-900 dark:text-white"
        data-target="dashboard">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
        </svg>
        <span class="text-[9px] font-black uppercase tracking-widest">概覽</span>
      </button>
      <button onclick="app.switchView('execution')"
        class="nav-btn flex flex-col items-center gap-1 transition-colors text-gray-400" data-target="execution">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5" />
        </svg>
        <span class="text-[9px] font-black uppercase tracking-widest">執行</span>
      </button>
      <button class="flex flex-col items-center gap-1 transition-colors text-gray-400 pointer-events-none opacity-50">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path
            d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
        <span class="text-[9px] font-black uppercase tracking-widest">設定</span>
      </button>
    </nav>
  </main>

  <script>
    const generateId = () => Math.random().toString(36).substr(2, 9);
    const getTodayStr = () => new Date().toLocaleDateString('en-CA');

    const getIcon = (name, size = 24, css = "") => {
      const icons = {
        Activity: `<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>`,
        Utensils: `<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>`,
        Moon: `<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>`,
        Trash2: `<path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2M10 11v6M14 11v6"/>`,
        Edit2: `<path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>`,
        ChevronRight: `<path d="m9 18 6-6-6-6"/>`,
        ChevronDown: `<path d="m6 9 6 6 6-6"/>`,
        FolderPlus: `<path d="M12 10v6M9 13h6M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>`,
        FilePlus: `<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/>`,
        Target: `<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>`,
        Check: `<path d="M20 6 9 17l-5-5"/>`,
        Alert: `<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>`
      };
      return `<svg width="${size}" height="${size}" class="${css}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icons[name] || ''}</svg>`;
    };

    // UI 彈窗系統
    const ui = {
      container: null,
      init() {
        this.container = document.createElement('div');
        this.container.id = 'ui-modal-root';
        document.body.appendChild(this.container);
      },
      open(html) {
        this.container.innerHTML = html;
        setTimeout(() => {
          const backdrop = document.getElementById('modal-backdrop');
          const card = document.getElementById('modal-card');
          if (backdrop) backdrop.classList.remove('opacity-0');
          if (card) card.classList.remove('scale-95', 'translate-y-4', 'opacity-0');
        }, 10);
      },
      close() {
        const backdrop = document.getElementById('modal-backdrop');
        const card = document.getElementById('modal-card');
        if (backdrop) backdrop.classList.add('opacity-0');
        if (card) card.classList.add('scale-95', 'translate-y-4', 'opacity-0');
        setTimeout(() => { this.container.innerHTML = ''; }, 200);
      },
      prompt(options) {
        return new Promise(resolve => {
          const fieldsHtml = options.fields.map(f => {
            if (f.type === 'select') {
              const opts = f.options.map(o => `<option value="${o.value}" ${o.value === f.value ? 'selected' : ''}>${o.label}</option>`).join('');
              return `<div><label class="block text-[10px] font-black uppercase text-gray-400 mb-1 tracking-widest">${f.label}</label><select id="modal-input-${f.id}" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white">${opts}</select></div>`;
            }
            return `<div><label class="block text-[10px] font-black uppercase text-gray-400 mb-1 tracking-widest">${f.label}</label><input type="${f.type}" id="modal-input-${f.id}" value="${f.value || ''}" placeholder="${f.placeholder || ''}" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white"></div>`;
          }).join('');

          const html = `
                        <div id="modal-backdrop" class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 transition-opacity duration-200">
                            <div id="modal-card" class="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-6 transform scale-95 translate-y-4 opacity-0 transition-all duration-200 flex flex-col max-h-[90vh] dark:bg-gray-800">
                                <h3 class="text-lg font-black text-gray-900 mb-4 dark:text-white">${options.title}</h3>
                                <div class="space-y-4 overflow-y-auto no-scrollbar flex-1 py-1">${fieldsHtml}</div>
                                <div class="flex gap-3 mt-6 pt-2">
                                    <button id="modal-btn-cancel" class="flex-1 py-3 rounded-xl bg-gray-100 text-gray-600 font-bold text-sm transition-colors hover:bg-gray-200 active:scale-95 dark:bg-gray-700 dark:text-gray-300">取消</button>
                                    <button id="modal-btn-confirm" class="flex-1 py-3 rounded-xl bg-blue-600 text-white font-bold text-sm shadow-md transition-transform active:scale-95">確認</button>
                                </div>
                            </div>
                        </div>
                    `;
          this.open(html);

          document.getElementById('modal-btn-cancel').onclick = () => { this.close(); resolve(null); };
          document.getElementById('modal-btn-confirm').onclick = () => {
            const result = {};
            options.fields.forEach(f => { result[f.id] = document.getElementById(`modal-input-${f.id}`).value; });
            this.close();
            resolve(result);
          };
        });
      },
      confirm(message) {
        return new Promise(resolve => {
          const html = `
                        <div id="modal-backdrop" class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 transition-opacity duration-200">
                            <div id="modal-card" class="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-6 text-center transform scale-95 translate-y-4 opacity-0 transition-all duration-200 dark:bg-gray-800">
                                <div class="w-16 h-16 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 dark:bg-red-900/30">${getIcon('Alert', 32)}</div>
                                <h3 class="text-lg font-black text-gray-900 mb-2 dark:text-white">確認操作</h3>
                                <p class="text-sm text-gray-500 font-medium mb-6 dark:text-gray-400">${message}</p>
                                <div class="flex gap-3">
                                    <button id="modal-btn-cancel" class="flex-1 py-3 rounded-xl bg-gray-100 text-gray-600 font-bold text-sm transition-colors hover:bg-gray-200 active:scale-95 dark:bg-gray-700 dark:text-gray-300">取消</button>
                                    <button id="modal-btn-confirm" class="flex-1 py-3 rounded-xl bg-red-500 text-white font-bold text-sm shadow-md transition-transform active:scale-95">確定</button>
                                </div>
                            </div>
                        </div>
                    `;
          this.open(html);
          document.getElementById('modal-btn-cancel').onclick = () => { this.close(); resolve(false); };
          document.getElementById('modal-btn-confirm').onclick = () => { this.close(); resolve(true); };
        });
      }
    };

    const DEFAULT_PILLARS = [
      { id: 'p1', title: '身體組成', icon: 'Activity', nodes: [] },
      { id: 'p2', title: '營養代謝', icon: 'Utensils', nodes: [] },
      { id: 'p3', title: '睡眠恢復', icon: 'Moon', nodes: [] }
    ];

    const app = {
      user: null, goals: [], pillars: [], tasks: [], activePillarId: null, expandedNodes: new Set(),
      db: null, auth: null, appId: 'struct-health-vanilla', isFirebaseActive: false,
      hangboardBodyLogs: {},

      init() {
        ui.init();
        this.applyTheme();
        document.getElementById('header-icon').innerHTML = getIcon('Activity', 20);

        this.db = db;
        this.auth = auth;

        auth.onAuthStateChanged(async user => {
          this.user = user;
          if (user) {
            this.isFirebaseActive = true;
            document.getElementById('user-avatar').textContent = user.uid.substring(0, 2).toUpperCase();
            try {
              await this.migrateLocalToCloud();
            } catch (e) {
              console.error('本機資料遷移到雲端失敗:', e);
            }
            this.bindRealtimeData();
          } else {
            this.isFirebaseActive = false;
            document.getElementById('user-avatar').textContent = '--';
            this.loadLocalData();
          }
        });
      },

      toggleAuth() {
        if (this.user) handleLogout(); else handleGoogleLogin();
      },

      // --- 深色模式：跟隨 Hangboard 設定頁寫入的同一個 localStorage 偏好，被動套用不提供切換開關 ---
      applyTheme() {
        const mode = localStorage.getItem('themeMode') || 'system';
        const isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', isDark);

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
          if ((localStorage.getItem('themeMode') || 'system') === 'system') this.applyTheme();
        });
      },

      // --- 本機資料 (未登入時的持久化，避免重新整理就消失) ---
      loadLocalData() {
        const saved = JSON.parse(localStorage.getItem('structHealthData') || 'null');
        this.pillars = saved?.pillars || DEFAULT_PILLARS;
        this.goals = saved?.goals || [];
        this.tasks = saved?.tasks || [];
        this.renderAll();
      },

      saveLocalData() {
        localStorage.setItem('structHealthData', JSON.stringify({
          pillars: this.pillars, goals: this.goals, tasks: this.tasks
        }));
      },

      // --- 首次登入時把本機資料搬到雲端，避免登入=資料歸零 ---
      async migrateLocalToCloud() {
        const saved = JSON.parse(localStorage.getItem('structHealthData') || 'null');
        if (!saved) return;

        const dbRoot = this.db.collection('artifacts').doc(this.appId).collection('users').doc(this.user.uid);
        for (const collectionName of ['goals', 'tasks', 'pillars']) {
          const items = saved[collectionName];
          if (!items || items.length === 0) continue;
          const existing = await dbRoot.collection(collectionName).limit(1).get();
          if (!existing.empty) continue;
          const batch = this.db.batch();
          items.forEach(item => {
            const { id, ...data } = item;
            batch.set(dbRoot.collection(collectionName).doc(id), data);
          });
          await batch.commit();
        }
        localStorage.removeItem('structHealthData');
      },

      async bindRealtimeData() {
        const dbRoot = this.db.collection('artifacts').doc(this.appId).collection('users').doc(this.user.uid);

        // 只在使用者從未擁有過任何支柱時播種預設值一次；
        // 放在即時監聽器內會導致使用者刻意刪光支柱後又被自動復活。
        const pillarsSnap = await dbRoot.collection('pillars').limit(1).get();
        if (pillarsSnap.empty) {
            for (const p of DEFAULT_PILLARS) await dbRoot.collection('pillars').doc(p.id).set(p);
        }

        // Hangboard 的體重/體脂/肌肉量紀錄（唯讀，供身體組成支柱帶入，不寫回 Hangboard）
        this.db.collection('users').doc(this.user.uid).collection('settings').doc('bodyLogs')
          .onSnapshot(doc => {
            this.hangboardBodyLogs = doc.exists ? doc.data() : {};
            if (this.activePillarId === 'p1') this.renderTree();
          });

        dbRoot.collection('goals').onSnapshot(snap => { this.goals = snap.docs.map(d => ({ id: d.id, ...d.data() })); this.renderDashboard(); });
        dbRoot.collection('tasks').onSnapshot(snap => { this.tasks = snap.docs.map(d => ({ id: d.id, ...d.data() })); this.renderDashboard(); this.renderExecution(); });
        dbRoot.collection('pillars').onSnapshot(snap => {
          this.pillars = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.id.localeCompare(b.id));
          this.renderDashboard();
          if (this.activePillarId) this.renderTree();
        });
      },

      switchView(viewId) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
        document.getElementById(`view-${viewId}`).classList.add('active');

        document.querySelectorAll('.nav-btn').forEach(btn => {
          btn.classList.remove('text-gray-900', 'dark:text-white');
          btn.classList.add('text-gray-400');
          if (btn.dataset.target === viewId) {
            btn.classList.remove('text-gray-400');
            btn.classList.add('text-gray-900', 'dark:text-white');
          }
        });

        if (viewId === 'dashboard') this.renderDashboard();
        if (viewId === 'execution') this.renderExecution();
      },

      openPillar(id) {
        this.activePillarId = id;
        this.switchView('pillar-detail');
        this.renderTree();
      },

      async apiAction(collectionName, action, id, data) {
        if (this.isFirebaseActive) {
          const ref = this.db.collection('artifacts').doc(this.appId).collection('users').doc(this.user.uid).collection(collectionName);
          if (action === 'add') await ref.add(data);
          if (action === 'update') await ref.doc(id).update(data);
          if (action === 'delete') await ref.doc(id).delete();
        } else {
          let list = this[collectionName];
          if (action === 'add') this[collectionName] = [...list, { id: generateId(), ...data }];
          if (action === 'update') this[collectionName] = list.map(item => item.id === id ? { ...item, ...data } : item);
          if (action === 'delete') this[collectionName] = list.filter(item => item.id !== id);
          this.saveLocalData();
          this.renderAll();
        }
      },

      renderAll() { this.renderDashboard(); if (this.activePillarId) this.renderTree(); this.renderExecution(); },

                                <button onclick="event.stopPropagation(); app.deletePillar('${p.id}')" class="text-gray-300 hover:text-red-400 p-1 bg-gray-50 rounded-full dark:bg-gray-700 dark:text-gray-400">${getIcon('Trash2', 14)}</button>
                            </div>
                            <div class="flex h-12 w-12 items-center justify-center rounded-2xl shrink-0 bg-gray-50 text-gray-700 dark:bg-gray-700 dark:text-gray-200">

        const completedCount = todayTasks.filter(t => (t.completedDates || []).includes(todayStr)).length;
        const todayScore = todayTasks.length > 0 ? (completedCount / todayTasks.length) : 0;

        calContainer.innerHTML = [...Array(28)].map((_, i) => {

          const dotsHTML = [...Array(3)].map((_, dotIdx) => `<div class="w-1 h-1 rounded-full ${dotIdx < dotCount ? 'bg-gray-800 dark:bg-gray-300' : 'bg-gray-100 dark:bg-gray-700'}"></div>`).join('');

      // =====================================
      // 樹狀結構 渲染與邏輯
      // =====================================
      // --- 身體組成支柱：唯讀帶入 Hangboard 已經記錄的體重/體脂/肌肉量，不用兩邊各填一次 ---
      getHangboardBodyLogs() {
        return this.isFirebaseActive
          ? (this.hangboardBodyLogs || {})
          : JSON.parse(localStorage.getItem('bodyLogs') || '{}');
      },

      renderBodySyncCard() {
        const logs = this.getHangboardBodyLogs();
        const dates = Object.keys(logs).sort();

        if (dates.length === 0) {
          return `<div class="mb-4 p-4 rounded-2xl bg-gray-50 border border-dashed border-gray-200 text-center dark:bg-gray-800/50 dark:border-gray-700">
            <p class="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-1">來自 Hangboard</p>
            <p class="text-xs text-gray-400">尚未在 Hangboard 記錄過身體數據</p>
          </div>`;
        }

        const latest = logs[dates[dates.length - 1]];
        return `<div class="mb-4 p-4 rounded-2xl bg-blue-50 border border-blue-100 dark:bg-blue-900/20 dark:border-blue-800">
          <p class="text-[10px] font-black uppercase tracking-widest text-blue-400 mb-2">來自 Hangboard · ${dates[dates.length - 1]}</p>
          <div class="grid grid-cols-3 gap-2 text-center">
            <div><div class="text-lg font-black text-gray-900 dark:text-white">${latest.weight ?? '--'}</div><div class="text-[9px] text-gray-400 font-bold">體重 kg</div></div>
            <div><div class="text-lg font-black text-gray-900 dark:text-white">${latest.bodyFat ?? '--'}</div><div class="text-[9px] text-gray-400 font-bold">體脂 %</div></div>
            <div><div class="text-lg font-black text-gray-900 dark:text-white">${latest.muscleMass ?? '--'}</div><div class="text-[9px] text-gray-400 font-bold">肌肉量 kg</div></div>
          </div>
        </div>`;
      },

      renderTree() {
        const pillar = this.pillars.find(p => p.id === this.activePillarId);
        if (!pillar) return;

        document.getElementById('pillar-detail-title').textContent = pillar.title;
        const container = document.getElementById('tree-container');
        const syncCardHtml = pillar.id === 'p1' ? this.renderBodySyncCard() : '';

        if (!pillar.nodes || pillar.nodes.length === 0) {
          container.innerHTML = syncCardHtml + `<div class="text-center p-8 text-gray-400 text-xs font-bold border border-dashed border-gray-200 rounded-2xl dark:border-gray-700">點擊右上角建立自訂層級結構</div>`;
          return;
        }

        const buildTreeHTML = (nodes, depth) => {
          return nodes.map(node => {
            const isLeaf = node.type === 'leaf';
            const isExpanded = !this.expandedNodes.has(node.id);
            let html = `<div class="mt-2 ${depth > 0 ? 'tree-indent' : ''}">`;

            html += `
                            <div class="flex items-center justify-between p-3 rounded-xl border ${isLeaf ? 'bg-white border-gray-100 shadow-sm dark:bg-gray-800 dark:border-gray-700' : 'bg-gray-50 border-transparent dark:bg-gray-700/50'} transition-colors">
                                <div class="flex items-center gap-2 flex-1">
                                    ${!isLeaf ? `<button onclick="app.toggleNode('${node.id}')" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">${getIcon(isExpanded ? 'ChevronDown' : 'ChevronRight', 16)}</button>` : ''}
                                    <span class="font-bold ${isLeaf ? 'text-sm text-gray-800 dark:text-gray-100' : 'text-xs uppercase tracking-widest text-gray-500 dark:text-gray-400'}">${node.name}</span>
                                </div>
                                <div class="flex items-center gap-2">
                        `;

            if (isLeaf) {
              html += `
                                <div class="flex items-center gap-1">
                                    <input type="number" value="${node.current}" onchange="app.updateLeaf('${node.id}', 'current', this.value)" class="w-12 bg-gray-100 p-1 rounded text-center font-mono text-xs border-none font-bold text-gray-900 focus:ring-1 focus:ring-gray-400 dark:bg-gray-700 dark:text-white" />
                                    <span class="text-gray-300 font-bold">/</span>
                                    <input type="number" value="${node.target}" onchange="app.updateLeaf('${node.id}', 'target', this.value)" class="w-12 bg-white border border-gray-100 p-1 rounded text-center font-mono text-xs text-gray-400 focus:ring-1 focus:ring-gray-400 dark:bg-gray-800 dark:border-gray-600" />
                                    <span class="text-[9px] font-black uppercase text-gray-300 w-5 text-left truncate">${node.unit}</span>
                                </div>
                            `;
            } else {
              html += `
                                <div class="flex gap-1">
                                    <button onclick="app.addNode('${node.id}', 'folder')" class="p-1 bg-gray-200 rounded text-gray-700 active:scale-95 dark:bg-gray-600 dark:text-gray-200">${getIcon('FolderPlus', 14)}</button>
                                    <button onclick="app.addNode('${node.id}', 'leaf')" class="p-1 bg-blue-600 text-white rounded active:scale-95">${getIcon('FilePlus', 14)}</button>
                                </div>
                            `;
            }

            html += `
                                    <button onclick="app.renameNode('${node.id}', '${node.name}')" class="text-gray-300 hover:text-blue-500 p-1 ml-1">${getIcon('Edit2', 14)}</button>
                                    <button onclick="app.deleteNode('${node.id}')" class="text-gray-300 hover:text-red-400 p-1">${getIcon('Trash2', 14)}</button>
                                </div>
                            </div>
                        `;

            if (isLeaf) {
              const pct = Math.min(100, (node.current / Math.max(node.target, 0.001)) * 100);
              html += `
                                <div class="mt-1.5 h-1 w-full bg-gray-50 rounded-full overflow-hidden dark:bg-gray-700">
                                    <div class="h-full bg-blue-600 transition-all duration-300" style="width: ${pct}%"></div>
                                </div>
                            `;
            }

            if (!isLeaf && isExpanded && node.children) html += `<div class="mt-1">${buildTreeHTML(node.children, depth + 1)}</div>`;
            html += `</div>`;
            return html;
          }).join('');
        };

        container.innerHTML = syncCardHtml + buildTreeHTML(pillar.nodes, 0);
      },

      _updatePillarTree(updaterFn) {
        const pillar = this.pillars.find(p => p.id === this.activePillarId);
        if (!pillar) return;
        this.apiAction('pillars', 'update', pillar.id, { nodes: updaterFn(pillar.nodes) });
      },

      _traverseMap(nodes, targetId, fn) {
        return nodes.map(n => {
          if (n.id === targetId) return fn(n);
          if (n.children) return { ...n, children: this._traverseMap(n.children, targetId, fn) };
          return n;
        });
      },

      _traverseFilter(nodes, targetId) {
        return nodes.filter(n => n.id !== targetId).map(n => ({
          ...n, children: n.children ? this._traverseFilter(n.children, targetId) : undefined
        }));
      },

      toggleNode(id) {
        if (this.expandedNodes.has(id)) this.expandedNodes.delete(id);
        else this.expandedNodes.add(id);
        this.renderTree();
      },

      async addNode(parentId, type) {
        const fields = [{ id: 'name', label: type === 'folder' ? '分類名稱' : '項目名稱', type: 'text' }];
        if (type === 'leaf') {
          fields.push({ id: 'target', label: '目標數值', type: 'number', value: '100' });
          fields.push({ id: 'unit', label: '單位 (如 kg, g)', type: 'text' });
        }

        const res = await ui.prompt({ title: type === 'folder' ? '新增分類' : '新增項目', fields });
        if (!res || !res.name) return;

        let newNode = { id: generateId(), name: res.name, type };
        if (type === 'leaf') {
          newNode.target = parseFloat(res.target) || 0;
          newNode.unit = res.unit || '';
          newNode.current = 0;
        } else {
          newNode.children = [];
        }

        if (parentId === 'root') {
          this._updatePillarTree(nodes => [...(nodes || []), newNode]);
        } else {
          this._updatePillarTree(nodes => this._traverseMap(nodes, parentId, n => ({ ...n, children: [...(n.children || []), newNode] })));
          this.expandedNodes.delete(parentId);
        }
      },

      async deleteNode(id) {
        if (await ui.confirm('確定刪除此節點與其所有子項目？')) this._updatePillarTree(nodes => this._traverseFilter(nodes, id));
      },

      updateLeaf(id, field, value) {
        this._updatePillarTree(nodes => this._traverseMap(nodes, id, n => ({ ...n, [field]: parseFloat(value) || 0 })));
      },

      async renameNode(id, oldName) {
        const res = await ui.prompt({ title: '重新命名', fields: [{ id: 'name', label: '名稱', type: 'text', value: oldName }] });
        if (res && res.name) this._updatePillarTree(nodes => this._traverseMap(nodes, id, n => ({ ...n, name: res.name })));
      },

        }).sort((a, b) => (a.time || '').localeCompare(b.time || ''));

          const recurringBadge = t.recurring !== 'none' ? `<span class="text-[8px] font-black text-gray-500 bg-gray-200 px-1.5 py-0.5 rounded uppercase dark:bg-gray-700 dark:text-gray-300">${t.recurring === 'daily' ? '每日' : '每週'}</span>` : '';

                                <div class="h-2 w-2 rounded-full ${isCompleted ? 'bg-blue-600' : 'bg-gray-300 dark:bg-gray-500'}"></div>
                            </div>

                                <div class="absolute -right-2 -top-2 flex gap-1 z-10">

                                    <button onclick="app.deleteTask('${t.id}')" class="bg-gray-100 text-red-500 rounded-full p-1.5 shadow-sm hover:bg-red-50 dark:bg-gray-700">${getIcon('Trash2', 12)}</button>

                                        <div class="flex items-center gap-2 mt-1">
                                            ${getIcon('Target', 12, 'text-gray-300')}

                                            ${recurringBadge}
                                        </div>
                                    </div>
                                    <button onclick="app.toggleTask('${t.id}')" class="rounded-full p-2 transition-colors active:scale-95 ${isCompleted ? 'bg-blue-600 text-white shadow-md' : 'bg-gray-50 text-gray-400 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600'}">
                                        ${getIcon('Check', 16)}
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;

      },

      async addTask() {
        const res = await ui.prompt({
          title: '新增任務',
          fields: [
            { id: 'title', label: '任務名稱', type: 'text', placeholder: '如：靜心冥想' },
            { id: 'time', label: '時段', type: 'time', value: '12:00' },
            { id: 'goal', label: '關聯目標', type: 'text', value: '日常維持' },
            { id: 'recurring', label: '重複設定', type: 'select', options: [{ value: 'none', label: '單次' }, { value: 'daily', label: '每天' }, { value: 'weekly', label: '每週' }] }
          ]
        });
        if (res && res.title) this.apiAction('tasks', 'add', null, { title: res.title, time: res.time, goal: res.goal, recurring: res.recurring, completedDates: [], createdAt: Date.now() });
      },

      async editTask(id) {
        const t = this.tasks.find(x => x.id === id);
        if (!t) return;
        const res = await ui.prompt({
          title: '修改任務',
          fields: [
            { id: 'title', label: '任務名稱', type: 'text', value: t.title },
            { id: 'time', label: '時段', type: 'time', value: t.time }
          ]
        });
        if (res && res.title) this.apiAction('tasks', 'update', id, { title: res.title, time: res.time });
      },

      async deleteTask(id) {
        if (await ui.confirm('確定要刪除此任務嗎？')) this.apiAction('tasks', 'delete', id);
      },

      toggleTask(id) {
        const task = this.tasks.find(t => t.id === id);
        if (!task) return;
        const todayStr = getTodayStr();
        const completedDates = task.completedDates || [];
        const isCompleted = completedDates.includes(todayStr);
        const newDates = isCompleted ? completedDates.filter(d => d !== todayStr) : [...completedDates, todayStr];
        this.apiAction('tasks', 'update', id, { completedDates: newDates });
      }
    };

    document.addEventListener('DOMContentLoaded', () => app.init());
  </script>
</body>

</html>
