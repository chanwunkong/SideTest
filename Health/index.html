<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>健康管理</title>
  <meta name="theme-color" content="#f5f6f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141614" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="健康">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/icon-180.png">

  <link rel="stylesheet" href="health.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<body>
  <main id="view"></main>
  <nav class="tabs" aria-label="主要分頁">

  <dialog id="sheet"></dialog>
  <div id="toast" role="status" hidden></div>
