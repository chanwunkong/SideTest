<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="秦殤">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>秦殤 測試版</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ccc; overflow: hidden; touch-action: none; font-family: sans-serif; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  /* 瀏海／底部橫條：用探針取 env(safe-area-inset-*)，畫布只佔安全區（虛擬按鍵跟著避開），其餘黑色 */
  #safe { position: fixed; inset: 0; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  canvas { display: block; image-rendering: auto; }
  /* 載入畫面：標題、進度條、下載了幾張圖／剩幾張；載入完成才消失，出錯顯示紅字 */
  #loader { position: fixed; inset: 0; z-index: 5; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  #ltitle { font-size: 40px; letter-spacing: 12px; color: #e8d9a8; }
  #lbar { width: min(70vw, 420px); height: 12px; border: 1px solid #8a7a50; border-radius: 7px; overflow: hidden; }
  #lfill { height: 100%; width: 0; background: #c9b36a; transition: width .15s; }
  #lsub { font-size: 15px; color: #ccc; }
  #lcount { font-size: 13px; color: #999; min-height: 1.2em; }
  #lerr { font-size: 14px; color: #f88; max-width: 80vw; text-align: center; word-break: break-all; }
  #status { position: fixed; top: 8px; left: 0; right: 0; text-align: center; font-size: 14px; pointer-events: none; }
</style>
</head>
<body>
<div id="safe"></div>
<div id="wrap"><canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas></div>
<div id="loader"><div id="ltitle">秦殤</div><div id="lbar"><div id="lfill"></div></div><div id="lsub">正在下載遊戲程式…</div><div id="lcount"></div><div id="lerr"></div></div>
<div id="status"></div>
<script>
  const canvas = document.getElementById('canvas');
  const status = document.getElementById('status');
  // 手機上看不到主控台：出錯就直接顯示在畫面上方，方便回報
  const loader = document.getElementById('loader'), lfill = document.getElementById('lfill'), lsub = document.getElementById('lsub'), lcount = document.getElementById('lcount'), lerr = document.getElementById('lerr');
  let failed = false;
  function fail(t) {  // 錯誤：紅字顯示在畫面上方，載入畫面還在的話也顯示在它上面（而且不再被進度蓋掉）
    failed = true;
    status.style.color = '#f88'; status.textContent = t;
    lerr.textContent = t;
  }
  addEventListener('error', (e) => fail('錯誤：' + (e.message || e.type)));
  addEventListener('unhandledrejection', (e) => fail('錯誤：' + (e.reason && e.reason.message || e.reason)));
  // 引擎（main.c js_status）呼叫：n < 0 載入場景（蓋上載入畫面）、n > 0 還有 n 張圖在下載、n == 0 好了。
  // 總數 = 載入期間累計排進來的圖張數（背景還會一直加），已下載 = 總數 − 剩下
  let total = 0, prev = 0, blocking = true;
  window.qinProgress = (n) => {
    if (failed) return;
    if (n < 0) { blocking = true; total = prev = 0; loader.style.display = 'flex'; lfill.style.width = '0'; lsub.textContent = '載入場景中…'; lcount.textContent = ''; return; }
    if (n > prev) total += n - prev;
    prev = n;
    if (n === 0) {
      total = 0;
      if (blocking) { blocking = false; loader.style.display = 'none'; }
      // 操作說明只給還沒碰過畫面的人看，之後收掉，不擋原版敵人狀態（同在畫面上方）
      status.textContent = window.qinTouched ? '' : '按住畫面走路，點怪物攻擊';
    } else if (blocking) {
      const done = total - n;
      lfill.style.width = (total ? done * 100 / total : 0) + '%';
      lsub.textContent = '載入場景中…';
      lcount.textContent = '已下載 ' + done + ' 張圖，還剩 ' + n + ' 張';
    } else status.textContent = '載入中… 還有 ' + n + ' 張圖';
  };
  for (const ev of ['pointerdown', 'keydown'])
    addEventListener(ev, () => { window.qinTouched = 1; if (!failed && !status.textContent.startsWith('載入')) status.textContent = ''; }, true);
  // 畫布塞滿整個可視區；遊戲畫面固定 4:3 不拉伸，橫式置中、直式貼上緣，其餘給觸控按鈕
  // （引擎每幀讀 innerWidth／innerHeight 排版，並把畫布緩衝設成同樣長寬比，這裡只負責 CSS 塞滿）
  // qinW／qinH = 安全區內的可用大小（引擎 js_inner_w／h 讀它）；canvas 放在安全區內（#wrap 全螢幕置中，用 margin 讓出非對稱的瀏海）
  const safeEl = document.getElementById('safe');
  function fit() {
    const c = getComputedStyle(safeEl), t = parseFloat(c.paddingTop) || 0, r = parseFloat(c.paddingRight) || 0, b = parseFloat(c.paddingBottom) || 0, l = parseFloat(c.paddingLeft) || 0;
    window.qinW = Math.max(1, innerWidth - l - r); window.qinH = Math.max(1, innerHeight - t - b);
    canvas.style.width = window.qinW + 'px';
    canvas.style.height = window.qinH + 'px';
    canvas.style.margin = `${t}px ${r}px ${b}px ${l}px`;
  }
  addEventListener('orientationchange', fit);
  addEventListener('resize', fit);
  fit();
  // 網址參數：?scene=別名&warp=N&level=N&prof=N&at=X,Y&item=T,L（測試用：站到第 N 個觸發區、主角等級、職業、站到某格、背包放道具）
  const q = new URLSearchParams(location.search);
  const args = ['game'];
  if (q.get('scene')) args.push(q.get('scene'));  // 沒指定 = 新遊戲（從原版開場房間開始）
  if (q.get('debug') === 'cells') args.push('--debug-cells'); else if (q.get('debug') === 'trace') args.push('--debug-trace');  // 疊圖：不可走／建築占地／觸發區
  if (q.get('bounce')) args.push('--debug-bounce', q.get('bounce'));  // 測試：進這個場景再回來，console 印耗時
  if (q.get('autotalk') === '1') args.push('--autotalk');  // 開啟走近自動說話（原版沒有，預設關）
  if (q.get('perf')) args.push('--perf');  // 左上顯示 FPS／最慢一幀／待載圖片數
  if (q.get('pos')) args.push('--show-pos');  // 左上顯示主角格座標（回報位置用）
  if (q.get('rec')) args.push('--rec', q.get('rec'));  // 測試：進場景就播這個過場
  if (q.get('warp')) args.push('--warp', q.get('warp'));
  if (q.get('level')) args.push('--level', q.get('level'));
  if (q.get('prof')) args.push('--prof', q.get('prof'));
  if (q.get('at')) args.push('--at', q.get('at'));
  if (q.get('money')) args.push('--money', q.get('money'));
  for (const it of q.getAll('learn')) args.push('--learn', it);  // learn=索引名,分類（模擬 skl_learn）
  if (q.get('weather')) args.push('--weather', q.get('weather'));
  if (q.get('hour')) args.push('--hour', q.get('hour'));
  if (q.get('clock')) args.push('--clock', q.get('clock'));
  for (const c of q.getAll('cmd')) args.push('--cmd', c);
  for (const it of q.getAll('item')) args.push('--item', it);  // item=類型,等級（可以多個）
  var Module = {
    canvas,
    arguments: args,
    setStatus: (t) => { if (t && loader.style.display !== 'none' && !failed) lsub.textContent = t; },  // emscripten 下載程式／資料的進度文字（之後的載入進度由遊戲自己更新，見 qinProgress）
    print: (t) => console.log(t),
    printErr: (t) => console.warn(t),
  };
  new ResizeObserver(fit).observe(canvas);
  // PWA：只有 https 或 localhost（安全環境）才有 service worker；http://100.x.x.x 沒有，照樣能玩只是不離線快取（見 HANDOFF「PWA」）
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch((e) => console.warn('service worker 註冊失敗', e));
</script>
{{{ SCRIPT }}}
</body>
</html>
