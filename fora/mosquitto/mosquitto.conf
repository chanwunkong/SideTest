# FORA AI broker（家用電腦）。啟動：mosquitto -c mosquitto.conf
allow_anonymous false
password_file ./passwd
acl_file ./acl

# worker 用（只聽本機／內網；叢集機器要連就改成內網 IP）
listener 1883 127.0.0.1

# 網頁用 WebSocket；對外經 Cloudflare Tunnel 轉成 wss
listener 9001 127.0.0.1
protocol websockets

# 照片最大約 1MB（1024px JPEG base64）
max_packet_size 2000000
