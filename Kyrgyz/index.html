<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kırgızça A1.1 — 聽著學吉爾吉斯語</title>
<style>
:root{
  --bg:#faf6ef; --card:#fff; --ink:#2a2420; --mute:#7d736a; --line:#e6ddd0;
  --red:#c8102e; --red-soft:#fbe9ec; --gold:#e6a700; --gold-soft:#fff4cf; --heard:#2f9e6b;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#1a1614; --card:#26201d; --ink:#f1e9df; --mute:#a3978b; --line:#3a312c;
    --red:#ff5a70; --red-soft:#3d1f24; --gold:#ffc83d; --gold-soft:#3b3115; --heard:#5fd39c; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.55;
  padding-bottom:200px}
header{background:var(--red);color:#fff;padding:14px 16px 10px}
header h1{margin:0;font-size:1.25rem;letter-spacing:.02em}
header p{margin:2px 0 0;font-size:.85rem;opacity:.9}
nav{position:sticky;top:0;z-index:5;display:flex;background:var(--card);border-bottom:1px solid var(--line)}
nav button{flex:1;padding:12px 4px;border:0;background:none;color:var(--mute);font:inherit;font-size:.95rem;
  border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--red);border-color:var(--red);font-weight:600}
main{max-width:980px;margin:0 auto;padding:14px 16px}
.settings{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.85rem;color:var(--mute);
  padding:10px 16px;max-width:980px;margin:0 auto}
.settings select{font:inherit;max-width:230px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.settings label{display:flex;gap:5px;align-items:center}
#voiceNote{flex-basis:100%;font-size:.8rem}
#voiceNote.warn{color:var(--red)}
section{display:none} section.on{display:block}
h2{font-size:1.05rem;margin:22px 0 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h2 small{font-weight:400;color:var(--mute);font-size:.8rem}
.lead{color:var(--mute);font-size:.9rem;margin:4px 0 12px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;
  padding:5px 12px;font:inherit;font-size:.82rem;cursor:pointer}
.btn:hover{border-color:var(--red)}
.btn.on{background:var(--red);border-color:var(--red);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:10px 6px 8px;text-align:center;cursor:pointer;font:inherit;color:inherit;min-height:112px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:transform .08s}
.card:active{transform:scale(.96)}
.card.playing{border-color:var(--gold);background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold)}
.card.heard::after{content:"";position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--heard)}
.card .pic{font-size:2rem;line-height:1.2}
.card .pic.txt{font-size:1.05rem;font-weight:600;color:var(--red);padding:9px 0}
.card .lat{font-size:1.02rem;font-weight:600}
.card .cyr,.cyr{font-size:.78rem;color:var(--mute)}
.card .zh{font-size:.78rem;color:var(--mute)}
body.nocyr .cyr{display:none}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);

.row.playing{border-color:var(--gold);background:var(--gold-soft)}
.row .lat{font-weight:600;font-size:1.02rem}
.row .zh{color:var(--mute);font-size:.88rem}
.row .spk{margin-left:auto;font-size:1.1rem;opacity:.6}
.lesson{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
.lesson summary{padding:12px 14px;cursor:pointer;font-weight:600;list-style:none;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.lesson summary::-webkit-details-marker{display:none}
.lesson summary .wals{font-weight:400;font-size:.72rem;color:var(--red);background:var(--red-soft);padding:1px 7px;border-radius:999px}
.lesson .body{padding:0 14px 14px;font-size:.93rem}
.ky{color:var(--red);font-weight:600;cursor:pointer;border-bottom:1px dotted var(--red)}
.ex{border-top:1px dashed var(--line);padding:9px 0 3px}
.ex .toks{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end}
.tok{border:0;background:var(--gold-soft);border-radius:8px;padding:4px 8px;cursor:pointer;font:inherit;color:inherit;text-align:center}
.tok b{display:block;font-size:1rem}
.tok i{display:block;font-style:normal;font-size:.72rem;color:var(--mute)}
.ex .tr{font-size:.86rem;color:var(--mute);margin-top:3px}
.widget{background:var(--bg);border-radius:10px;padding:10px;margin-top:10px}
.widget .out{font-size:1.5rem;font-weight:700;text-align:center;padding:10px 0 2px;cursor:pointer}
.widget .outsub{text-align:center;color:var(--mute);font-size:.85rem}

#now .lat{font-size:1.35rem;font-weight:700;overflow-wrap:anywhere}
#now .zh{font-size:.9rem;color:var(--mute)}

#now .ctl button.rec{background:var(--red);color:#fff;border-color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px var(--red-soft)}}
#nowState{font-size:.82rem;color:var(--red);font-weight:600;min-height:1.2em}
#meter{display:none;height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:3px}
#meter i{display:block;height:100%;width:0;background:var(--red)}
#now .ctl{display:flex;gap:8px;flex:none}
@media (max-width:560px){#now{flex-wrap:wrap;gap:8px}#now .mid{flex-basis:calc(100% - 64px)}#now .ctl{margin-left:auto}}

table.ab{border-collapse:collapse;font-size:.88rem;margin-top:6px}
table.ab td{padding:2px 10px 2px 0;vertical-align:top}

<script>

const C2L = {а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'yo',ж:'c',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',ң:'ñ',
  о:'o',ө:'ö',п:'p',р:'r',с:'s',т:'t',у:'u',ү:'ü',ф:'f',х:'h',ц:'ts',ч:'ç',ш:'ş',щ:'şç',ъ:'',ы:'ı',ь:'',э:'e',ю:'yu',я:'ya'};
function lat(s){
  let out = '';
  for (const ch of s){
    const lo = ch.toLowerCase();
    if (!(lo in C2L)) { out += ch; continue; }
    let l = C2L[lo];
    if (ch !== lo && l) l = (l[0] === 'i' ? 'İ' : l[0].toUpperCase()) + l.slice(1);
    out += l;
  }
  return out;
}

function loadVoices(){
  if (!synth) { $('voiceNote').textContent = '這個瀏覽器不支援語音合成。'; $('voiceNote').className = 'warn'; return; }
  voices = synth.getVoices();
  const usable = voices.filter(v => PREF.includes(v.lang.slice(0,2).toLowerCase()))
    .sort((a,b) => PREF.indexOf(a.lang.slice(0,2).toLowerCase()) - PREF.indexOf(b.lang.slice(0,2).toLowerCase()));
  zhVoice = voices.find(v => /zh[-_]TW/i.test(v.lang)) || voices.find(v => /^zh/i.test(v.lang)) || null;
  const sel = $('voiceSel'), saved = store.get('voice', '');
  sel.innerHTML = usable.map(v => `<option value="${v.name}">${v.name} (${v.lang})</option>`).join('') || '<option value="">（找不到可用語音）</option>';
  if (usable.some(v => v.name === saved)) sel.value = saved;
  setVoice();
}
function setVoice(){
  kyVoice = voices.find(v => v.name === $('voiceSel').value) || null;
  const n = $('voiceNote');
  if (!kyVoice) { n.className = 'warn'; n.textContent = voices.length ? '系統裡沒有吉爾吉斯／哈薩克／土耳其／俄語語音。建議用 Microsoft Edge 開啟，或在系統設定安裝土耳其語語音。' : '語音載入中…'; return; }
  const k = kyVoice.lang.slice(0,2).toLowerCase();
  n.className = k === 'ru' ? 'warn' : ''; n.textContent = QUALITY[k];
}
// 依語音的語言把吉爾吉斯文轉成它讀得出來的字串
function forVoice(cyr){
  const k = kyVoice ? kyVoice.lang.slice(0,2).toLowerCase() : '';
  if (k === 'tr') return lat(cyr).toLowerCase().replace(/ñ/g, 'ng');
  if (k === 'ru') return cyr.replace(/ө/g,'о').replace(/Ө/g,'О').replace(/ү/g,'у').replace(/Ү/g,'У').replace(/ң/g,'н');
  return cyr;
}
function utter(text, voice, lang, rate){
  return new Promise(res => {
    if (!synth) return res();
    const u = new SpeechSynthesisUtterance(text);
    if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = lang;
    u.rate = rate; u.onend = u.onerror = () => res();
    keep = u; // Chrome 會回收未被引用的 utterance 而不觸發 onend
    synth.speak(u);
  });
}

// ───────── 跟讀：錄下自己的聲音，和示範連著聽 ─────────
let micStream = null, analyser = null, rec = null, recTimer = 0, myBlob = null, audioEl = null, audioDone = null;
const setState = t => $('nowState').textContent = t;
async function mic(){
  if (micStream) return micStream;
  micStream = await navigator.mediaDevices.getUserMedia({audio:true});
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = ctx.createAnalyser(); analyser.fftSize = 512;
  ctx.createMediaStreamSource(micStream).connect(analyser);
  return micStream;
}
function meterLoop(){
  if (!rec) { $('meter').style.display = 'none'; return; }
  const a = new Uint8Array(analyser.fftSize); analyser.getByteTimeDomainData(a);
  let m = 0; for (const v of a) m = Math.max(m, Math.abs(v - 128));
  $('meter').firstChild.style.width = Math.min(100, m / 128 * 180) + '%';
  requestAnimationFrame(meterLoop);
}
// 錄 ms 毫秒（或直到 endRec()）；麥克風不可用時回傳 null
function record(ms){
  return mic().then(st => new Promise(res => {
    const chunks = [], r = new MediaRecorder(st);
    r.ondataavailable = e => chunks.push(e.data);
    r.onstop = () => { clearTimeout(recTimer); rec = null; $('nowMic').classList.remove('rec'); res(new Blob(chunks, {type:r.mimeType})); };
    rec = r; r.start(); $('nowMic').classList.add('rec'); $('meter').style.display = 'block'; meterLoop();
    recTimer = setTimeout(endRec, ms);
  })).catch(() => null);
}
function endRec(){ if (rec && rec.state !== 'inactive') rec.stop(); }
function playMine(){
  return new Promise(res => {
    if (!myBlob) return res();
    audioDone = res; audioEl = new Audio(URL.createObjectURL(myBlob));
    audioEl.onended = audioEl.onerror = () => res();
    audioEl.play().catch(() => res());
  });
}
async function shadow(){
  if (rec) return endRec();
  if (!last) return;
  stop(); const my = token;
  setState('🎙 換你說——說完再按一次 🎙');
  const b = await record(8000);
  if (token !== my) return;
  if (!b) return setState('用不了麥克風：請允許權限，並以 https 或 localhost 開啟。');
  myBlob = b; compare();
}
async function compare(){
  if (!last) return;
  if (!myBlob) return setState('先按 🎙 錄下你的聲音。');
  stop(); const my = token;
  setState('示範'); await sayKy(last.c); if (token !== my) return;
  await wait(300); if (token !== my) return;
  setState('你的聲音'); await playMine(); if (token !== my) return;
  setState('再按 🎙 重錄，或 👥 再比較一次');
}
const wait = ms => new Promise(r => setTimeout(r, ms));
function stop(){ token++; if (synth) synth.cancel(); endRec(); setState('');
  if (audioEl) { audioEl.pause(); audioEl = null; audioDone && audioDone(); } document.querySelectorAll('.playing').forEach(e => e.classList.remove('playing')); document.querySelectorAll('.btn.listen.on').forEach(b => { b.classList.remove('on'); b.textContent = '▶ 連續聽'; }); }

function show(item){
  if (item !== last) myBlob = null;
  last = item;
  $('nowPic').textContent = item.e || '🔊';
  $('nowLat').textContent = lat(item.c);
  $('nowCyr').textContent = item.c;
  $('nowZh').textContent = item.z || '';
  if (!heard.has(item.c)) { heard.add(item.c); store.set('heard', [...heard]); }
  if (item.el) item.el.classList.add('heard');
}
function tap(item, rate){ stop(); show(item); return sayKy(item.c, rate); }

// 連續聽：示範 → 留空檔給使用者跟讀並錄音 → 回放使用者的聲音 → 再示範（關閉跟讀時改為念兩遍）
async function playAll(items, btn){
  if (btn.classList.contains('on')) return stop();
  stop(); const my = token;
  btn.classList.add('on'); btn.textContent = '⏹ 停止';
  for (const it of items){
    if (token !== my) return;
    if (it.el.offsetParent === null) continue;
    it.el.classList.add('playing'); it.el.scrollIntoView({block:'center', behavior:'smooth'}); show(it);
    const t0 = performance.now();
    await sayKy(it.c); if (token !== my) return;
    if ($('shadow').checked){
      const gap = Math.max(1800, (performance.now() - t0) * 1.3 + 700);
      setState('🎙 換你說');
      const b = await record(gap); if (token !== my) return;
      if (b) { myBlob = b; setState('你的聲音'); await playMine(); }
      else { setState('（麥克風未開啟）跟著說一遍'); await wait(gap); }
      if (token !== my) return;
      setState('示範再一次'); await sayKy(it.c); setState('');
    } else { await wait(500); if (token !== my) return; await sayKy(it.c, 0.6); }
    if (token !== my) return;
    if ($('zhSpeak').checked && it.z) { await wait(250); await sayZh(it.z); if (token !== my) return; }
    await wait(700);
    it.el.classList.remove('playing');
  }
  if (token === my) stop();
}

// ───────── 畫面 ─────────
const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
function listenBtn(items){ const b = h('button','btn listen','▶ 連續聽'); b.onclick = () => playAll(items, b); return b; }

function renderAlphabet(){
  const s = $('abc');
  s.append(h('p','lead','吉爾吉斯語用西里爾字母書寫。這裡把每個字母轉成拉丁字母（共同突厥字母的寫法），之後全站都以拉丁字母為主、西里爾原文為輔。點字母聽例詞。'));
  const items = [], g = h('div','grid');
  for (const row of ALPHABET){
    const [l, w, hint] = row.split('|');
    const b = h('button','card', `<span class="pic txt">${(lat(l) || '—')} <span class="cyr" style="display:inline">${l.toUpperCase()}${l}</span></span><span class="lat">${lat(w)}</span><span class="cyr">${w}</span><span class="zh">${hint}</span>`);
    const it = {c:w, z:hint, e:lat(l) || l, el:b}; items.push(it);
    if (heard.has(w)) b.classList.add('heard');
    b.onclick = () => tap(it); g.append(b);
  }
  const hd = h('h2','', '36 個字母 '); hd.append(listenBtn(items)); s.append(hd, g);
  s.append(h('h2','','要特別聽的六個音'), h('div','lead',
   '<table class="ab"><tr><td><b>ö</b> ө</td><td>圓唇的「ㄝ」</td></tr><tr><td><b>ü</b> ү</td><td>注音 ㄩ</td></tr><tr><td><b>ı</b> ы</td><td>沒有點的 i：嘴角後拉的「ㄨ」</td></tr><tr><td><b>ñ</b> ң</td><td>ng</td></tr><tr><td><b>c</b> ж</td><td>英語 j（jam）</td></tr><tr><td><b>ç ş</b> ч ш</td><td>ch、sh</td></tr></table>寫兩個母音（aa、oo、uu、öö、üü）就是把它拉長：<span class="ky" data-c="тоо">too</span> 山、<span class="ky" data-c="суу">suu</span> 水、<span class="ky" data-c="төө">töö</span> 駱駝。'));
}

function renderVocab(){
  const s = $('voc');
  s.append(h('p','lead','約 260 個 A1.1 的基礎概念。能用 emoji 表達的直接看圖聽音；表達不了的（代名詞、連接詞、抽象詞）用中文標示。'));
  const chips = h('div','chips'); let filt = 'all';
  const secs = [];
  [['all','全部'],['emo','🖼 可用圖表達'],['txt','文 只能用文字']].forEach(([k, label]) => {
    const b = h('button','btn' + (k === 'all' ? ' on' : ''), label);
    b.onclick = () => { stop(); filt = k; chips.querySelectorAll('.btn').forEach(x => x.classList.toggle('on', x === b));
      secs.forEach(sec => { let n = 0; sec.items.forEach(it => { const ok = k === 'all' || (k === 'emo') === !!it.e; it.el.style.display = ok ? '' : 'none'; n += ok; }); sec.wrap.style.display = n ? '' : 'none'; }); };
    chips.append(b);
  });
  s.append(chips);
  for (const [theme, words] of VOCAB){
    const wrap = h('div'), g = h('div','grid'), items = [];
    for (const w of words){
      const [c, e, z, x, xz] = w.split('|');
      const b = h('button','card', `<span class="pic${e ? '' : ' txt'}">${e || z}</span><span class="lat">${lat(c)}</span><span class="cyr">${c}</span>${e ? `<span class="zh">${z}</span>` : ''}`);
      const it = {c, e, z, el:b}; items.push(it);
      if (heard.has(c)) b.classList.add('heard');
      // 有例句的詞：再點一次同一張卡就聽例句
      b.onclick = () => { if (x && last === it) { tap({c:x, z:xz, e, el:b}); last = null; } else { tap(it); if (x) $('nowZh').textContent = z + '　（再點一次聽例句）'; } };
      g.append(b);
    }
    const hd = h('h2','', `${theme} <small>${words.length}</small> `); hd.append(listenBtn(items));
    wrap.append(hd, g); s.append(wrap); secs.push({wrap, items});
  }
}

function renderPhrases(){
  const s = $('phr');
  s.append(h('p','lead','整句先聽熟，再去文法頁看它為什麼長這樣。'));
  for (const [theme, list] of PHRASES){
    const items = [], wrap = h('div');
    for (const p of list){
      const [c, z, note] = p.split('|');
      const b = h('button','row', `<span><span class="lat">${lat(c)}</span><br><span class="cyr">${c}</span><br><span class="zh">${z}${note ? '　·　' + note : ''}</span></span><span class="spk">🔊</span>`);
      const it = {c, z, e:'💬', el:b}; items.push(it);
      b.onclick = () => tap(it); wrap.append(b);
    }
    const hd = h('h2','', theme + ' '); hd.append(listenBtn(items)); s.append(hd, wrap);
  }
}

function picker(labels, onPick){
  const c = h('div','chips');
  labels.forEach((l, i) => { const b = h('button','btn' + (i ? '' : ' on'), l); b.onclick = () => { c.querySelectorAll('.btn').forEach(x => x.classList.toggle('on', x === b)); onPick(i); }; c.append(b); });
  return c;
}
function widget(table, colLabels, colZh){
  const keys = Object.keys(table), w = h('div','widget'), out = h('div','out'), sub = h('div','outsub');
  let r = 0, c = 0;
  const upd = speak => { const f = table[keys[r]][c]; out.textContent = lat(f); sub.innerHTML = `<span class="cyr" style="display:inline">${f}</span>　${keys[r].split('|')[1]}・${colZh ? colZh[c] : colLabels[c]}`;
    if (speak) tap({c:f, z:keys[r].split('|')[1] + '・' + (colZh ? colZh[c] : colLabels[c]), e:'🧩'}); };
  w.append(picker(keys.map(k => `${lat(k.split('|')[0])} ${k.split('|')[1]}`), i => { r = i; upd(true); }),
           picker(colLabels.map(l => /[а-яөүң]/.test(l) ? lat(l) : l), i => { c = i; upd(true); }), out, sub);
  out.onclick = () => upd(true); upd(false);
  return w;
}

function renderGrammar(){
  const s = $('gra');
  s.append(h('p','lead','用 WALS（世界語言結構地圖集）的類型特徵來看吉爾吉斯語的骨架，只挑造出最簡單句子所需要的部分。每個例句可整句聽，也可以點單字一個一個聽。'));
  GRAMMAR.forEach((L, i) => {
    const d = h('details','lesson'); if (!i) d.open = true;
    d.append(h('summary','', `<span>${i + 1}. ${L.t}</span><span class="wals">${L.w}</span>`));
    const body = h('div','body', L.b.replace(/\{(.+?)\}/g, (_, c) => `<span class="ky" data-c="${c}">${lat(c)}</span>`));
    if (L.widget === 'verb') body.append(widget(VERBS, PERSONS, PERSON_ZH));
    if (L.widget === 'case') body.append(widget(NOUNS, CASES));
    for (const x of L.ex){
      const [toks, punct, zh] = x.split('|');
      const pairs = toks.split(' ').map(t => { const [w, g] = t.split('='); return [w.replace(/_/g,' '), g]; });
      const full = pairs.map(p => p[0]).join(' ') + punct;
      const ex = h('div','ex'), row = h('div','toks');
      for (const [w, g] of pairs){ const b = h('button','tok', `<b>${lat(w)}</b><span class="cyr">${w}</span><i>${g}</i>`); b.onclick = () => tap({c:w, z:g, e:'🧩'}); row.append(b); }
      const all = h('button','btn','🔊 整句'); all.onclick = () => tap({c:full, z:zh, e:'💬'}); row.append(all);
      ex.append(row, h('div','tr', zh)); body.append(ex);
    }
    d.append(body); s.append(d);
  });
  s.append(h('p','lead','註：WALS 是語言類型資料庫，本身不分 CEFR 等級；這裡是以它的特徵項目為清單，挑出 A1.1「自我介紹、指認事物、簡單需求」會用到的結構。'));
}

// 造句：誰 × 動作 × 對象，動詞人稱自動配合
const BUILD = [
 ['ич','{s}喝{o}',['чай|茶','суу|水','сүт|牛奶','кофе|咖啡']],
 ['же','{s}吃{o}',['нан|麵包','алма|蘋果','эт|肉','балык|魚']],
 ['оку','{s}讀{o}',['китеп|書','кат|信']],
 ['бар','{s}去{o}',['мектепке|學校','базарга|市集','үйгө|家','шаарга|城裡']],
 ['кел','{s}從{o}來',['мектептен|學校','базардан|市集','үйдөн|家','Тайвандан|台灣']],
 ['жаша','{s}住在{o}',['Бишкекте|比什凱克','шаарда|城裡','айылда|村裡','Тайванда|台灣']],
];
function renderBuilder(){
  const s = $('bld');
  s.append(h('p','lead','自己換零件造句。三個位置永遠是 <b>誰 → 對象 → 動作</b>，動詞尾巴會跟著「誰」變。每換一次都會念出來——聽完按「🎙 換我說」自己說一遍，再聽兩者的差別。'));
  const w = h('div','widget build'), out = h('div','toks'), tr = h('div','outsub'), objBox = h('div');
  let si = 0, vi = 0, oi = 0;
  const vkey = i => Object.keys(VERBS).find(k => k.startsWith(BUILD[i][0] + '|'));
  const upd = speak => {
    const [ , tpl, objs] = BUILD[vi], [o, oz] = objs[oi].split('|'), v = VERBS[vkey(vi)][si], sub = PERSONS[si];
    const who = PERSON_ZH[si].split('／')[0], zh = tpl.replace('{s}', who).replace('{o}', oz) + '。';
    const item = {c: sub[0].toUpperCase() + sub.slice(1) + ' ' + o + ' ' + v + '.', z:zh, e:'💬'};
    out.innerHTML = '';
    [[sub, who], [o, oz], [v, vkey(vi).split('|')[1] + '（' + who + '）']].forEach(([c, g]) => {
      const b = h('button','tok', `<b>${lat(c)}</b><span class="cyr">${c}</span><i>${g}</i>`); b.onclick = () => tap({c, z:g, e:'🧩'}); out.append(b); });
    const all = h('button','btn','🔊 整句'), me = h('button','btn','🎙 換我說');
    all.onclick = () => tap(item);
    me.onclick = () => { if (!rec && last !== item) { stop(); show(item); } shadow(); };
    out.append(all, me); tr.textContent = zh;
    if (speak) tap(item);
  };
  const objs = () => { oi = 0; objBox.innerHTML = ''; objBox.append(picker(BUILD[vi][2].map(x => lat(x.split('|')[0]) + ' ' + x.split('|')[1]), i => { oi = i; upd(true); })); };
  w.append(h('div','cyr','誰'), picker(PERSONS.slice(0, 6).map((p, i) => lat(p) + ' ' + PERSON_ZH[i]), i => { si = i; upd(true); }),
           h('div','cyr','動作'), picker(BUILD.map((b, i) => lat(b[0]) + ' ' + vkey(i).split('|')[1]), i => { vi = i; objs(); upd(true); }),
           h('div','cyr','對象'), objBox, out, tr);
  objs(); upd(false); s.append(w);
  s.append(h('p','lead','一百多個句子。試著不看畫面先自己說出來，再點「整句」確認。'));
}

// ───────── 啟動 ─────────
renderAlphabet(); renderVocab(); renderPhrases(); renderGrammar(); renderBuilder();
document.addEventListener('click', e => { const k = e.target.closest('.ky'); if (k) tap({c:k.dataset.c, e:'🔤'}); });
$('nav').onclick = e => { const t = e.target.dataset.t; if (!t) return; stop();
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b === e.target));
  document.querySelectorAll('section').forEach(x => x.classList.toggle('on', x.id === t)); window.scrollTo(0, 0); };
$('voiceSel').onchange = () => { store.set('voice', $('voiceSel').value); setVoice(); };
$('showCyr').onchange = () => document.body.classList.toggle('nocyr', !$('showCyr').checked);
$('nowAgain').onclick = () => last && tap(last);
$('nowSlow').onclick = () => last && tap(last, 0.5);
$('nowMic').onclick = shadow;
$('nowCmp').onclick = compare;
$('nowStop').onclick = stop;
if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; } else loadVoices();
</script>
